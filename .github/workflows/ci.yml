name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ./node_modules/.cache/ms-playwright
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run regression tests and enforced coverage
        run: npm run test:coverage

      - name: Run lint
        run: npm run lint

      - name: Check types and formatting
        run: npm run check

      - name: Build Chrome extension
        run: npm run build

      - name: Build root-path fictional demo
        run: npm run demo:build

      - name: Verify production output and public documentation
        run: npm run verify:builds && npm run check:docs

      - name: Install isolated Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify synthetic native-panel extension flows
        run: npm run test:browser

      - name: Verify root-path fictional demo
        run: npm run test:demo

      - name: Build and verify nested-path fictional demo
        env:
          DEMO_BASE: /threadshelf/
        run: npm run demo:build && npm run verify:builds && npm run test:demo
